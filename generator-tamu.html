<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Nama Tamu</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container-box {
            max-width: 450px;
            margin: 20px auto;
            padding: 20px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .btn-custom {
            background: #0d6efd;
            color: white;
            border-radius: 8px;
        }

        .btn-custom:hover {
            background: #0b5ed7;
        }

        .link-box {
            background: #f8f9fa;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            word-wrap: break-word;
        }
    </style>
</head>

<body class="bg-light">

    <div class="container-box">
        <h4 class="mb-3 text-center">Generator Nama Tamu</h4>

        <div class="mb-3">
            <label class="form-label">Nama Pengantin</label>
            <input id="pengantin" type="text" class="form-control" readonly>
        </div>

        <div class="mb-3">
            <label class="form-label">Nama Tamu</label>
            <input id="namaTamu" type="text" class="form-control" placeholder="Masukkan nama tamu">
        </div>

        <div class="mb-3">
            <label class="form-label">Link Undangan</label>
            <div id="linkUndangan" class="link-box">https://momenin.my.id/</div>
        </div>
        <p>Note : Tulis nama tamu -> Generate -> Salin -> langsung tempel di Whatsapp dll</p>
        <button id="generateBtn" class="btn btn-custom w-100 mb-2" onclick="generateText()">Generate</button>
        <button id="copyBtn" class="btn btn-custom w-100 mb-2" id="copyBtn" onclick="copyText()">Salin</button>
        <button id="resetBtn" class="btn btn-danger w-100" onclick="resetForm()">Reset</button>

        <div id="output"></div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Ambil nama pengantin dari URL
        const urlParams = new URLSearchParams(window.location.search);
        let pengantinParam = urlParams.get('pengantin') || "firin-sihah";

        // Format pengantin jadi "Andi & Ainun"
        function formatPengantin(text) {
            return text.split('-').map(kata => kata.charAt(0).toUpperCase() + kata.slice(1)).join(' & ');
        }

        // Format nama tamu kapital di awal setiap kata
        function capitalizeName(name) {
            return name.split(' ').filter(Boolean).map(kata => kata.charAt(0).toUpperCase() + kata.slice(1)).join(' ');
        }

        const pengantinInput = document.getElementById('pengantin');
        pengantinInput.value = formatPengantin(pengantinParam);

        const linkDasar = "https://momenin.my.id/" + pengantinParam;
        document.getElementById('linkUndangan').value = linkDasar;

        function generateText() {
            const namaTamu = capitalizeName(document.getElementById('namaTamu').value.trim());
            const linkUndangan = linkDasar + "?to=" + namaTamu.replace(/\s+/g, '-');

            const template = `
Shalom & Salam Sejahtera,

*Yth. ${namaTamu}*

Dengan penuh sukacita, kami mengundang Bapak/Ibu/Saudara/i, teman sekaligus sahabat, untuk hadir dan memberikan doa restu pada acara pernikahan kami :

*${formatPengantin(pengantinParam)}*

Berikut tautan undangan lengkap kami yang memuat detail waktu dan tempat acara :
 
${linkUndangan}

Merupakan kebahagiaan besar bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir dan turut bersukacita bersama kami.

Mohon maaf undangan ini kami sampaikan melalui pesan singkat. Terima kasih atas perhatian dan doa restunya.

Tuhan memberkati.`;

            document.getElementById('output').innerText = template;
        }

        function copyText() {
            const output = document.getElementById('output').innerText;
            navigator.clipboard.writeText(output).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.innerText = "Sudah Tersalin";
                copyBtn.disabled = true;
                setTimeout(() => {
                    copyBtn.innerText = "Salin";
                    copyBtn.disabled = false;
                }, 2000);
            });
        }

        function resetForm() {
            document.getElementById('namaTamu').value = "";
            document.getElementById('output').innerText = "";
        }
    </script>
</body>

</html>
