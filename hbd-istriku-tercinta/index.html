<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="description" content="happy birthday to you IB-Empire">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <title>Happy Birthday to your friends</title>
  <link rel='stylesheet' href='https://fonts.googleapis.com/css?family=Source+Sans+Pro:900'>

</head>

<body onclick="play()">

  <script>
    function play() {
      var audio = document.getElementById("audio");
      audio.play();
    }
    
    function startCelebration() {
      // Hide the start container
      document.querySelector('.start-container').style.display = 'none';
      
      // Show the celebration container and canvas
      document.querySelector('.celebration-container').style.display = 'block';
      document.getElementById('birthday').style.display = 'block';
      
      // Play the audio
      var audio = document.getElementById("audio");
      audio.play().catch(function(error) {
        console.log("Audio play failed:", error);
      });
      
      // Start automatic fireworks
      setTimeout(() => {
        birthday.onClick({clientX: window.innerWidth/2, clientY: window.innerHeight/2});
      }, 500);
    }
  </script>

  <audio id="audio" src="mabruk.mp3" loop></audio>

  <script>
    var myTimeout = setTimeout(function () {

    }, 3000);
  </script>

  <div class="start-container">
    <button class="celebration-button" onclick="startCelebration()">
      🎉 Mulai Perayaan 🎉
    </button>
  </div>

  <div class="celebration-container" style="display: none;">
    <h1 class="main-title">
      <span class="heart">💝</span>
      Selamat
      <span class="heart">💝</span>
    </h1>
    <h1 class="main-title">
      <span class="heart">💝</span>
      Ulang Tahun
      <span class="heart">💝</span>
    </h1>
    <h2 class="sub-title">
      🌹 Istriku Tersayang 🌹
    </h2>
    <h2 class="sub-title">
      🌹 Tercinta 🌹
    </h2>
  </div>
  <canvas id="birthday"></canvas>

  <script>
    // helper functions
    const PI2 = Math.PI * 2
    const random = (min, max) => Math.random() * (max - min + 1) + min | 0
    const timestamp = _ => new Date().getTime()

    // container
    class Birthday {
      constructor() {
        this.resize()

        // create a lovely place to store the firework
        this.fireworks = []
        this.counter = 0

      }

      resize() {
        this.width = canvas.width = window.innerWidth
        let center = this.width / 2 | 0
        this.spawnA = center - center / 4 | 0
        this.spawnB = center + center / 4 | 0

        this.height = canvas.height = window.innerHeight
        this.spawnC = this.height * .1
        this.spawnD = this.height * .5

      }

      onClick(evt) {
        let x = evt.clientX || evt.touches && evt.touches[0].pageX
        let y = evt.clientY || evt.touches && evt.touches[0].pageY

        let count = random(3, 5)
        for (let i = 0; i < count; i++) this.fireworks.push(new Firework(
          random(this.spawnA, this.spawnB),
          this.height,
          x,
          y,
          random(0, 260),
          random(30, 110)))

        this.counter = -1

      }

      update(delta) {
        ctx.globalCompositeOperation = 'hard-light'
        ctx.fillStyle = `rgba(20,20,20,${7 * delta})`
        ctx.fillRect(0, 0, this.width, this.height)

        ctx.globalCompositeOperation = 'lighter'
        for (let firework of this.fireworks) firework.update(delta)

        // if enough time passed... create new new firework
        this.counter += delta * 3 // each second
        if (this.counter >= 1) {
          this.fireworks.push(new Firework(
            random(this.spawnA, this.spawnB),
            this.height,
            random(0, this.width),
            random(this.spawnC, this.spawnD),
            random(0, 360),
            random(30, 110)))
          this.counter = 0
        }

        // remove the dead fireworks
        if (this.fireworks.length > 1000) this.fireworks = this.fireworks.filter(firework => !firework.dead)

      }
    }

    class Firework {
      constructor(x, y, targetX, targetY, shade, offsprings) {
        this.dead = false
        this.offsprings = offsprings

        this.x = x
        this.y = y
        this.targetX = targetX
        this.targetY = targetY

        this.shade = shade
        this.history = []
      }
      update(delta) {
        if (this.dead) return

        let xDiff = this.targetX - this.x
        let yDiff = this.targetY - this.y
        if (Math.abs(xDiff) > 3 || Math.abs(yDiff) > 3) { // is still moving
          this.x += xDiff * 2 * delta
          this.y += yDiff * 2 * delta

          this.history.push({
            x: this.x,
            y: this.y
          })

          if (this.history.length > 25) this.history.shift()

        } else {
          if (this.offsprings && !this.madeChilds) {

            let babies = this.offsprings / 2
            for (let i = 0; i < babies; i++) {
              let targetX = this.x + this.offsprings * Math.cos(PI2 * i / babies) | 0
              let targetY = this.y + this.offsprings * Math.sin(PI2 * i / babies) | 0

              birthday.fireworks.push(new Firework(this.x, this.y, targetX, targetY, this.shade, 0))

            }

          }
          this.madeChilds = true
          this.history.shift()
        }

        if (this.history.length === 0) this.dead = true
        else if (this.offsprings) {
          for (let i = 0; this.history.length > i; i++) {
            let point = this.history[i]
            ctx.beginPath()
            ctx.fillStyle = 'hsl(' + this.shade + ',100%,' + i + '%)'
            ctx.arc(point.x, point.y, 1, 0, PI2, false)
            ctx.fill()
          }
        } else {
          ctx.beginPath()
          ctx.fillStyle = 'hsl(' + this.shade + ',100%,50%)'
          ctx.arc(this.x, this.y, 1, 0, PI2, false)
          ctx.fill()
        }

      }
    }

    let canvas = document.getElementById('birthday')
    let ctx = canvas.getContext('2d')

    let then = timestamp()

    let birthday = new Birthday
    window.onresize = () => birthday.resize()
    document.onclick = evt => birthday.onClick(evt)
    document.ontouchstart = evt => birthday.onClick(evt)

      ; (function loop() {
        requestAnimationFrame(loop)

        let now = timestamp()
        let delta = now - then

        then = now
        birthday.update(delta / 1000)


      })()

  </script>
  <style>
    body {
      margin: 0;
      background: #020202;
      cursor: crosshair;
      height: 100vh;
      overflow: hidden;
    }

    canvas {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    @keyframes animate {
      0% {
        opacity: 0.7;
        transform: skewy(3deg);
        filter: hue-rotate(0deg);

      }

      100% {
        transform: skewX(18deg);
        opacity: 1;
        filter: hue-rotate(360deg);
      }
    }

    .birthday {
      position: absolute;
      top: 50%;
      left: 42.8%;
      color: blueviolet;
      font-family: "Source Sans Pro";
      animation: animate 4s linear 5;
      font-size: 55px;
      text-shadow:
        0 0 5px #ff4a00,
        0 0 18px #fff;
    }

    .birthday:hover {
      color: orange;
      text-shadow:
        0 0 5px #00ffeb,
        0 0 18px #fff;
    }

    .start-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
      text-align: center;
      width: 100%;
      max-width: 600px;
      padding: 20px;
    }

    .welcome-title {
      font-family: 'Dancing Script', cursive;
      font-size: 2em;
      font-weight: 700;
      color: #6c5ce7;
      text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
      margin: 20px 0;
      animation: welcome-glow 2s ease-in-out infinite alternate;
    }

    .welcome-subtitle {
      font-family: 'Poppins', sans-serif;
      font-size: 1.2rem;
      color: #45b7d1;
      margin: 20px 0;
      animation: fade-in-out 3s ease-in-out infinite;
    }

    @keyframes welcome-glow {
      0% {
        text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3), 0 0 20px #6c5ce7;
      }
      100% {
        text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3), 0 0 40px #6c5ce7, 0 0 60px #6c5ce7;
      }
    }

    @keyframes fade-in-out {
      0%, 100% {
        opacity: 0.7;
      }
      50% {
        opacity: 1;
      }
    }

    .celebration-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      text-align: center;
      width: 100%;
      max-width: 800px;
      padding: 20px;
    }

    .main-title {
      font-family: 'Dancing Script', cursive;
      font-size: 3em;
      font-weight: 700;
      text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
      margin: 10px 0;
      animation: colorChange 3s ease-in-out infinite, bounce 2s ease-in-out infinite;
    }

    .sub-title {
      font-family: 'Poppins', sans-serif;
      font-size: 2rem;
      font-weight: 600;
      animation: colorChange 4s ease-in-out infinite reverse, pulse 1.5s ease-in-out infinite;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      margin: 20px 0;
    }

    @keyframes colorChange {
      0% {
        color: #ff6b6b;
      }

      16% {
        color: #4ecdc4;
      }

      32% {
        color: #45b7d1;
      }

      48% {
        color: #f9ca24;
      }

      64% {
        color: #f0932b;
      }

      80% {
        color: #eb4d4b;
      }

      100% {
        color: #6c5ce7;
      }
    }

    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-20px);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }
    }

    .heart {
      display: inline-block;
      color: #e74c3c;
      animation: heartbeat 1.5s ease-in-out infinite;
      margin: 0 10px;
      font-size: 2rem;
    }

    @keyframes heartbeat {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.3);
      }
    }

    .celebration-button {
      background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #f9ca24);
      background-size: 400% 400%;
      border: none;
      border-radius: 50px;
      color: white;
      font-family: 'Poppins', sans-serif;
      font-size: 1.5rem;
      font-weight: 600;
      padding: 15px 30px;
      margin-top: 30px;
      cursor: pointer;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
      animation: gradientShift 3s ease infinite, buttonPulse 2s ease-in-out infinite;
      position: relative;
      z-index: 3;
    }

    .celebration-button:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 25px rgba(0, 0, 0, 0.4);
      animation-play-state: paused;
    }

    .celebration-button:active {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }

    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    @keyframes buttonPulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }
    @media (max-width: 768px) {
      .main-title {
        font-size: 2em;
      }
      
      .sub-title {
        font-size: 1.5rem;
      }
      
      .heart {
        font-size: 1.5rem;
      }
    }

    @media (max-width: 480px) {
      .main-title {
        font-size: 1.5em;
      }
      
      .sub-title {
        font-size: 1.2rem;
      }
      
      .heart {
        font-size: 1.2rem;
      }
    }
  </style>
</body>

</html>
