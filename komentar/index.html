<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Panel Komentar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <h3 id="judul"></h3>
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>EventID</th>
        <th>Name</th>
        <th>Message</th>
        <th>Attendance</th>
        <th>Timestamp</th>
        <th>Aksi</th>
      </tr>
    </thead>
    <tbody id="tabel"></tbody>
  </table>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const pengantin = urlParams.get('pengantin');
    document.getElementById('judul').innerText = 'Komentar untuk: ' + pengantin;

    fetch(`SCRIPT_URL?action=get&pengantin=${pengantin}`)
      .then(r => r.json())
      .then(rows => {
        const tbody = document.getElementById('tabel');
        rows.forEach(row => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${row.EventID}</td>
            <td>${row.Name}</td>
            <td>${row.Message}</td>
            <td>${row.Attendance}</td>
            <td>${row.Timestamp}</td>
            <td><button class="btn btn-danger btn-sm" onclick="hapus(${row.EventID}, '${row.Pengantin}', '${row.Timestamp}')">Hapus</button></td>`;
          tbody.appendChild(tr);
        });
      });

    function hapus(id, pengantin, ts) {
      if (!confirm('Yakin hapus?')) return;
      fetch(`https://script.google.com/macros/s/AKfycbwdBYkIHnVJsJn4-RmWgVelmELGnfJACHTyu7T-28hAsdDRyxg8_vypHogY1GmhFG7g/exec?action=delete&id=${id}&pengantin=${pengantin}&timestamp=${encodeURIComponent(ts)}`)
        .then(r => r.text())
        .then(alert)
        .then(() => location.reload());
    }
  </script>
</body>
</html>
