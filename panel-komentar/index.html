<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel Komentar</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f8f9fa;
    }
    .comment-card {
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .comment-body {
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .comment-meta {
      font-size: 13px;
      color: #6c757d;
    }
    .delete-btn {
      font-size: 14px;
    }
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 200px;
    }
    .error-message {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      border-radius: 5px;
      padding: 10px;
    }
  </style>
</head>
<body>
  <div class="container my-4">
    <div class="text-center mb-4">
      <h2 class="fw-bold">📋 Panel Komentar</h2>
      <p class="text-muted">Kelola komentar untuk: <span id="pengantinLabel" class="fw-semibold"></span></p>
      <button class="btn btn-primary btn-sm" onclick="refreshKomentar()">🔄 Refresh</button>
    </div>

    <div id="commentList" class="row justify-content-center">
      <div class="col-12 loading">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <span class="ms-2">Loading komentar...</span>
      </div>
    </div>
  </div>

  <!-- Toast untuk notifikasi -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="successToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="toast-header bg-success text-white">
        <strong class="me-auto">Berhasil</strong>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
      </div>
      <div class="toast-body" id="successMessage"></div>
    </div>
    <div id="errorToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="toast-header bg-danger text-white">
        <strong class="me-auto">Error</strong>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
      </div>
      <div class="toast-body" id="errorMessage"></div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let currentPengantin = null;
    let currentLink = null;

    // Fungsi untuk menampilkan toast
    function showToast(type, message) {
      const toastId = type === 'success' ? 'successToast' : 'errorToast';
      const messageId = type === 'success' ? 'successMessage' : 'errorMessage';
      
      document.getElementById(messageId).textContent = message;
      const toast = new bootstrap.Toast(document.getElementById(toastId));
      toast.show();
    }

    // Ambil parameter dari URL
    function getQueryParam(key) {
      return new URLSearchParams(window.location.search).get(key);
    }

    async function loadConfig(pengantin) {
      try {
        // Tambahkan cache busting untuk memastikan config terbaru
        const timestamp = new Date().getTime();
        const res = await fetch(`config.json?v=${timestamp}`);
        
        if (!res.ok) {
          throw new Error(`HTTP error! status: ${res.status}`);
        }
        
        const config = await res.json();
        console.log("Config loaded:", config);
        return config[pengantin] || null;
      } catch (err) {
        console.error("Gagal load config:", err);
        showToast('error', `Gagal memuat config: ${err.message}`);
        return null;
      }
    }

    async function loadKomentar(pengantin, link) {
      try {
        console.log("Loading comments from:", link);
        
        const res = await fetch(link + "?action=get", {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
          }
        });

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}: ${res.statusText}`);
        }

        const data = await res.json();
        console.log("Comments loaded:", data);

        let html = "";
        if (!data || data.length === 0) {
          html = `<div class="col-12 text-center text-muted">
                    <div class="p-4">
                      <i class="fas fa-comment-slash fa-3x mb-3"></i>
                      <p>Belum ada komentar.</p>
                    </div>
                  </div>`;
        } else {
          // Urutkan berdasarkan timestamp terbaru
          data.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
          
          data.forEach((komen, index) => {
            // Escape HTML untuk keamanan
            const safeName = escapeHtml(komen.name || 'Anonim');
            const safeMessage = escapeHtml(komen.message || '');
            const safeTimestamp = escapeHtml(komen.timestamp || '');
            
            html += `
              <div class="col-12 col-md-8">
                <div class="card comment-card">
                  <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                      <h6 class="card-title mb-0">${safeName}</h6>
                      <button class="btn btn-sm btn-outline-danger delete-btn" 
                              onclick="hapusKomentar('${escapeAttribute(link)}', '${escapeAttribute(komen.timestamp)}', ${index})"
                              title="Hapus komentar ini">
                        <i class="fas fa-trash"></i> Hapus
                      </button>
                    </div>
                    <p class="card-text comment-body mb-2">${safeMessage}</p>
                    <p class="comment-meta mb-0">
                      <i class="fas fa-clock"></i> ${formatTimestamp(safeTimestamp)}
                    </p>
                  </div>
                </div>
              </div>
            `;
          });
        }
        document.getElementById("commentList").innerHTML = html;
      } catch (err) {
        console.error("Error loading comments:", err);
        document.getElementById("commentList").innerHTML =
          `<div class="col-12 text-center">
             <div class="error-message">
               ❌ Gagal memuat komentar: ${err.message}
               <br><small>Cek console untuk detail error</small>
             </div>
           </div>`;
        showToast('error', `Gagal memuat komentar: ${err.message}`);
      }
    }

    async function hapusKomentar(link, timestamp, index) {
      if (!confirm("Yakin ingin menghapus komentar ini?")) return;
      
      try {
        console.log("Deleting comment:", { link, timestamp, index });
        
        // Nonaktifkan tombol hapus sementara
        const deleteBtn = event.target.closest('button');
        const originalText = deleteBtn.innerHTML;
        deleteBtn.disabled = true;
        deleteBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menghapus...';
        
        const deleteUrl = `${link}?action=delete&timestamp=${encodeURIComponent(timestamp)}`;
        console.log("Delete URL:", deleteUrl);
        
        const response = await fetch(deleteUrl, {
          method: 'POST', // Coba dengan POST jika GET tidak berhasil
          headers: {
            'Content-Type': 'application/json',
          }
        });
        
        console.log("Delete response status:", response.status);
        console.log("Delete response:", await response.clone().text());
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
        showToast('success', 'Komentar berhasil dihapus');
        
        // Refresh list setelah berhasil hapus
        setTimeout(() => {
          loadKomentar(currentPengantin, currentLink);
        }, 1000);
        
      } catch (err) {
        console.error("Error deleting comment:", err);
        showToast('error', `Gagal menghapus komentar: ${err.message}`);
        
        // Aktifkan kembali tombol jika gagal
        const deleteBtn = event.target.closest('button');
        deleteBtn.disabled = false;
        deleteBtn.innerHTML = '<i class="fas fa-trash"></i> Hapus';
      }
    }

    function refreshKomentar() {
      if (currentPengantin && currentLink) {
        loadKomentar(currentPengantin, currentLink);
      }
    }

    // Utility functions
    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.toString().replace(/[&<>"']/g, function(m) { return map[m]; });
    }

    function escapeAttribute(text) {
      return text.toString().replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function formatTimestamp(timestamp) {
      if (!timestamp) return 'Waktu tidak diketahui';
      try {
        const date = new Date(timestamp);
        return date.toLocaleString('id-ID');
      } catch (err) {
        return timestamp;
      }
    }

    // Main initialization
    (async () => {
      const pengantin = getQueryParam("pengantin");
      if (!pengantin) {
        document.getElementById("commentList").innerHTML =
          `<div class="col-12 text-center">
             <div class="error-message">
               ⚠️ Parameter 'pengantin' tidak ditemukan di URL.<br>
               <small>Contoh URL yang benar: ?pengantin=nama_pengantin</small>
             </div>
           </div>`;
        return;
      }
      
      currentPengantin = pengantin;
      document.getElementById("pengantinLabel").textContent = pengantin;

      const link = await loadConfig(pengantin);
      if (!link) {
        document.getElementById("commentList").innerHTML =
          `<div class="col-12 text-center">
             <div class="error-message">
               ⚠️ Link WebApp untuk pengantin "${pengantin}" belum diset di config.json<br>
               <small>Pastikan config.json sudah ter-commit dan terdeploy</small>
             </div>
           </div>`;
        return;
      }
      
      currentLink = link;
      await loadKomentar(pengantin, link);
    })();
  </script>
</body>
</html>
