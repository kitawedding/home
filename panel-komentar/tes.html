<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel Komentar</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .comment-card {
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .comment-meta { font-size: 13px; color: #6c757d; }
  </style>
</head>
<body>
  <div class="container my-4">
    <div class="text-center mb-4">
      <h2 class="fw-bold">📋 Panel Komentar</h2>
      <p class="text-muted">Kelola komentar untuk: <span id="pengantinLabel" class="fw-semibold"></span></p>
    </div>

    <div id="commentList" class="row justify-content-center">
      <div class="col-12 text-center text-muted">Loading komentar...</div>
    </div>
  </div>

  <script>
    const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbz2eoqH2FOksB-uBWu1RHIh1qOI1M1VBxgZ_cKMtJiGHMwXTp4m3M7BN9Ctne0p-dmTCA/exec"; 
    // contoh: "https://script.google.com/macros/s/AKfycbw.../exec"

    function getQueryParam(key) {
      return new URLSearchParams(window.location.search).get(key);
    }

    async function loadKomentar(pengantin) {
      try {
        const res = await fetch(`${WEBAPP_URL}?action=get&pengantin=${pengantin}`);
        const data = await res.json();

        let html = "";
        if (data.length === 0) {
          html = `<div class="col-12 text-center text-muted">Belum ada komentar.</div>`;
        } else {
          data.forEach((komen) => {
            html += `
              <div class="col-12 col-md-8">
                <div class="card comment-card">
                  <div class="card-body d-flex justify-content-between align-items-start">
                    <div>
                      <h6 class="mb-1">${komen.name}</h6>
                      <p class="mb-1">${komen.message}</p>
                      <p class="comment-meta mb-0">${komen.timestamp || ""}</p>
                    </div>
                    <button class="btn btn-sm btn-danger" onclick="hapusKomentar('${pengantin}', '${komen.timestamp}')">
                      Hapus
                    </button>
                  </div>
                </div>
              </div>
            `;
          });
        }
        document.getElementById("commentList").innerHTML = html;
      } catch (err) {
        console.error(err);
        document.getElementById("commentList").innerHTML = `<div class="col-12 text-danger text-center">❌ Gagal memuat data.</div>`;
      }
    }

    async function hapusKomentar(pengantin, timestamp) {
      if (!confirm("Yakin hapus komentar ini?")) return;
      try {
        await fetch(`${WEBAPP_URL}?action=delete&pengantin=${pengantin}&timestamp=${encodeURIComponent(timestamp)}`);
        loadKomentar(pengantin);
      } catch (err) {
        alert("❌ Gagal hapus komentar.");
      }
    }

    // Main
    (async () => {
      const pengantin = getQueryParam("pengantin");
      if (!pengantin) {
        document.getElementById("commentList").innerHTML = `<div class="col-12 text-warning text-center">⚠️ Parameter pengantin tidak ditemukan di URL.</div>`;
        return;
      }
      document.getElementById("pengantinLabel").textContent = pengantin;
      loadKomentar(pengantin);
    })();
  </script>
</body>
</html>
